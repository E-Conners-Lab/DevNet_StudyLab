name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Local release verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: npm ci && npm ci --prefix apps/web
      - run: npm audit --audit-level=high && npm audit --audit-level=high --prefix apps/web
      - run: npm run lint --prefix apps/web
      - run: npm run test:coverage --prefix apps/web
      - run: npm run test:content --prefix apps/web
      - run: npm run test:runtime
      - name: Scan full history for secrets
        shell: bash
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          printf '%s  %s\n' '79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --log-opts=--all .
      - run: npm run release:build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e --prefix apps/web
        env:
          TUTOR_ANTHROPIC_KEY: ''
          TUTOR_MODEL: ''
      - run: npm run test:sandbox
      - run: npm run test:tutor-browser
      - name: Upload verified snapshot for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: devnet-studylab-local
          path: release-artifacts/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: verification-failure
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
