name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default. A job that needs to write grants the scope itself.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm run lint --prefix apps/web

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm test --prefix apps/web
        env:
          DATABASE_URL: ""
          AUTH_SECRET: ci-test-secret

  content-validation:
    name: Content Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci && npm ci --prefix apps/web
      - run: npm run test:content --prefix apps/web

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, content-validation]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm run build --prefix apps/web
        env:
          DATABASE_URL: ""
          AUTH_SECRET: ci-build-secret

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studylab
          POSTGRES_PASSWORD: studylab_ci
          POSTGRES_DB: studylab
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U studylab"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run db:generate --prefix apps/web
        env:
          DATABASE_URL: postgresql://studylab:studylab_ci@localhost:5432/studylab
      - run: npm run db:migrate --prefix apps/web
        env:
          DATABASE_URL: postgresql://studylab:studylab_ci@localhost:5432/studylab
      - run: npm run db:seed --prefix apps/web
        env:
          DATABASE_URL: postgresql://studylab:studylab_ci@localhost:5432/studylab
      - run: npm run test:e2e --prefix apps/web
        env:
          DATABASE_URL: postgresql://studylab:studylab_ci@localhost:5432/studylab
          AUTH_SECRET: ci-e2e-secret
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  python-tests:
    name: Lab Engine Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/lab-engine/requirements-dev.txt
      # The image installs the lock, so CI must too - otherwise the tests pass
      # against a dependency tree the container never sees.
      - run: pip install -r services/lab-engine/requirements.lock.txt
      - run: pip install -r services/lab-engine/requirements-dev.txt
      - name: Run lab engine tests
        run: python -m pytest tests/ -v
        working-directory: services/lab-engine

  lock-drift:
    name: Dependency Lock Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # The Dockerfile installs requirements.lock.txt, so a pin bumped in
      # requirements.txt without regenerating the lock would silently build the
      # old tree. Fail the build instead.
      - run: python3 scripts/check-lock-drift.py

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: npm ci --prefix apps/web
      # Runtime dependencies must be clean. Dev-only advisories are reported but
      # do not block: the known ones are build-tool dev-server issues with no
      # upstream fix (drizzle-kit pins a deprecated esbuild-kit chain).
      - name: Audit npm runtime dependencies
        run: npm audit --omit=dev --audit-level=high --prefix apps/web
      - name: Report npm dev advisories (non-blocking)
        run: npm audit --prefix apps/web || true
      - run: pip install pip-audit
      - name: Audit Python dependencies
        run: pip-audit --strict -r services/lab-engine/requirements.lock.txt
